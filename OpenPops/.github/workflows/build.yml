name: Build

# Builds and tests OpenPops on a macOS runner.
# Every run uploads OpenPops.zip as an artifact. Pushing a tag like v1.0.0
# also publishes it as a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build app (Apple silicon + Intel)
        run: ./build.sh --universal --zip

      - name: Self-test
        run: scripts/self-test.sh

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: OpenPops-app
          path: build/OpenPops.zip
          if-no-files-found: error

      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenPops-self-test
          path: build/self-test
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenPops-app

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenPops.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenPops ${GITHUB_REF_NAME#v}" \
            --notes "Download OpenPops.zip below, unzip it and move OpenPops.app to Applications. It's signed ad hoc, not notarized, so the first time you open it, go to System Settings → Privacy & Security and click Open Anyway. See the README for details."
